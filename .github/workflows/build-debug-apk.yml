# Nexus Studio — clean debug APK pipeline
# Sections map 1:1 to product layers: checkout → toolchain → runtime package → Flutter APK → verify → artifact

name: Build Nexus Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "studio/**"
      - "core/native/**"
      - "scripts/**"
      - ".github/workflows/build-debug-apk.yml"

concurrency:
  group: nexus-debug-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Package arm64 debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # --- Toolchain (Java + Android SDK/NDK + Flutter) ---
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK licenses + NDK 27
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SM="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          if [ -z "$SM" ]; then
            SM="$(find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1 || true)"
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" "ndk;27.0.12077973" || {
            echo "WARN: NDK 27 install failed; Flutter may still resolve a side-by-side NDK"
            ls "$ANDROID_HOME/ndk" || true
          }

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # --- Embedded runtime (bootstrap zip + proot jniLibs) ---
      - name: Prepare embedded runtime
        run: |
          set -euo pipefail
          bash scripts/ci-prepare-runtime.sh

      # --- Flutter build ---
      - name: Flutter pub get
        working-directory: studio
        run: flutter pub get

      - name: Build debug APK (arm64 focus)
        working-directory: studio
        run: |
          set -euo pipefail
          flutter build apk --debug --target-platform android-arm64

      # --- Integrity checks before upload ---
      - name: Verify APK contents
        run: |
          set -euo pipefail
          APK="studio/build/app/outputs/flutter-apk/app-debug.apk"
          test -f "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "APK size bytes=$SIZE"
          # Sanity: must be a real zip APK, not tiny/corrupt
          if [ "$SIZE" -lt 5000000 ]; then
            echo "ERROR: APK too small ($SIZE) — likely incomplete build" >&2
            exit 1
          fi
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'assets/flutter_assets\|lib/arm64' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libproot.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libtalloc.so' /tmp/apk-list.txt
          grep -q 'lib/arm64-v8a/libproot-loader.so' /tmp/apk-list.txt
          grep -q 'assets/bootstrap/bootstrap-aarch64.zip' /tmp/apk-list.txt
          # Must NOT ship versioned soname Android won't extract
          if grep -q 'libtalloc.so.2' /tmp/apk-list.txt; then
            echo "ERROR: APK contains libtalloc.so.2 (not extractable)" >&2
            exit 1
          fi
          echo "APK content checks passed"

      - name: Upload nexus-debug-apk
        uses: actions/upload-artifact@v4
        with:
          name: nexus-debug-apk
          path: studio/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
