name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub-hosted runners already have Android SDK + cmdline-tools.
      # Avoid android-actions/setup-android@v3 — it tries to install the
      # obsolete "tools" package and fails on current Ubuntu 24.04 images.
      - name: Accept Android licenses + install NDK 27
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/cmdline-tools" || true
          # Find sdkmanager
          SM=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SM" ]; then
            SM=$(find /usr/local/lib/android -name sdkmanager -type f 2>/dev/null | head -1)
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses >/dev/null || true
          # Prefer NDK 27 (avoids previous NDK 28 zip issues on some runners)
          for i in 1 2 3; do
            if "$SM" "ndk;27.0.12077973"; then
              echo "NDK 27.0.12077973 installed"
              ls "$ANDROID_HOME/ndk" || true
              exit 0
            fi
            echo "sdkmanager NDK attempt $i failed, retry..."
            sleep 5
          done
          echo "NDK install failed — continuing; Flutter may use side-by-side or default"
          ls "$ANDROID_HOME/ndk" || true

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch embedded runtime (bootstrap + proot)
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          TAG="bootstrap-2026.11.01-r1+apt.android-7"
          ASSETS="studio/android/app/src/main/assets/bootstrap"
          JNI="studio/android/app/src/main/jniLibs/arm64-v8a"
          mkdir -p "$ASSETS" "$JNI"
          curl -fsSL -L -o "$ASSETS/bootstrap-aarch64.zip" \
            "https://github.com/termux/termux-packages/releases/download/${TAG}/bootstrap-aarch64.zip"
          BASE="https://packages.termux.dev/apt/termux-main"
          cd /tmp
          curl -fsSL -L -o proot.deb "$BASE/pool/main/p/proot/proot_5.1.107.102_aarch64.deb"
          curl -fsSL -L -o talloc.deb "$BASE/pool/main/libt/libtalloc/libtalloc_2.5.0_aarch64.deb"
          curl -fsSL -L -o shmem.deb "$BASE/pool/main/liba/libandroid-shmem/libandroid-shmem_0.7_aarch64.deb"
          rm -rf debroot && mkdir debroot && cd debroot
          for d in proot.deb talloc.deb shmem.deb; do
            ar x /tmp/$d
            tar xf data.tar.* 2>/dev/null || true
            rm -f data.tar.* control.tar.* debian-binary
          done
          USR=data/data/com.termux/files/usr
          cp -f "$USR/bin/proot" "${{ github.workspace }}/$JNI/libproot.so"
          cp -f "$USR/libexec/proot/loader" "${{ github.workspace }}/$JNI/libproot-loader.so"
          cp -f "$USR/lib/libandroid-shmem.so" "${{ github.workspace }}/$JNI/libandroid-shmem.so"
          # Real file + SONAME that proot DT_NEEDED expects (libtalloc.so.2)
          cp -f "$USR/lib/libtalloc.so.2.5.0" "${{ github.workspace }}/$JNI/libtalloc.so"
          cp -f "$USR/lib/libtalloc.so.2.5.0" "${{ github.workspace }}/$JNI/libtalloc.so.2"
          # If a versioned shmem soname exists, ship it too
          if [ -f "$USR/lib/libandroid-shmem.so.0" ]; then
            cp -f "$USR/lib/libandroid-shmem.so.0" "${{ github.workspace }}/$JNI/libandroid-shmem.so.0"
          fi
          chmod 755 "${{ github.workspace }}/$JNI"/*
          ls -lh "${{ github.workspace }}/$ASSETS"
          ls -lh "${{ github.workspace }}/$JNI"
          # Sanity: show NEEDED of proot if readelf available
          readelf -d "${{ github.workspace }}/$JNI/libproot.so" 2>/dev/null | grep NEEDED || true

      - name: Toolchain versions
        run: |
          flutter --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/ndk" || true

      - run: flutter pub get
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: nexus-apk
          path: studio/build/app/outputs/flutter-apk/app-debug.apk
