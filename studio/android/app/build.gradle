plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.nexus.studio"
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    // Debug keystore is committed for CI/local debug installs only.
    // Release must use private secrets (or explicitly opt into debug signing).
    signingConfigs {
        debug {
            storeFile file("../keystore/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            def ksPath = System.getenv("NEXUS_RELEASE_STORE_FILE")
            def ksPass = System.getenv("NEXUS_RELEASE_STORE_PASSWORD")
            def keyAliasEnv = System.getenv("NEXUS_RELEASE_KEY_ALIAS")
            def keyPass = System.getenv("NEXUS_RELEASE_KEY_PASSWORD")
            if (ksPath != null && ksPass != null && keyAliasEnv != null && keyPass != null) {
                storeFile file(ksPath)
                storePassword ksPass
                keyAlias keyAliasEnv
                keyPassword keyPass
            }
        }
    }

    defaultConfig {
        applicationId = "com.nexus.studio"
        minSdk = 26
        targetSdk = 34
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
        }
        release {
            // Prefer real release secrets; allow debug keystore only when opted in.
            if (System.getenv("NEXUS_RELEASE_STORE_FILE") != null) {
                signingConfig = signingConfigs.release
            } else if (System.getenv("NEXUS_ALLOW_DEBUG_RELEASE") == "true") {
                signingConfig = signingConfigs.debug
            }
            // else: unsigned release — forces explicit choice before distribution
        }
    }

    // Important for proot / native libs
    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    sourceSets {
        main {
            // Point to our shared Kotlin runtime code
            java.srcDirs += [
                '../../../core/native/android/src/main/kotlin'
            ]
            assets.srcDirs += ['src/main/assets']
            jniLibs.srcDirs += ['src/main/jniLibs']
        }
    }
}

flutter {
    source = "../.."
}

dependencies {}
